[project]
name = "arena-hero-agent"
version = "0.1.32"
description = "Deterministic Python agent runtime and control plane for Arena Hero"
readme = "README.md"
license = "Apache-2.0"
keywords = ["arena-hero", "agent", "game-ai", "multi-agent"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
    "License :: OSI Approved :: Apache Software License",
]
requires-python = ">=3.11"
dependencies = [
    "arena-hero==0.3.0a4",
]

[project.scripts]
arena-hero-agent = "arena_hero_agent.cli:console_entrypoint"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "ty>=0.0.1",
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "hypothesis>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arena_hero_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv.sources]
arena-hero = { git = "https://github.com/DeliciousBuding/arena-hero-sdk-py.git", tag = "v0.3.0a4" }
