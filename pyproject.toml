[project]
name = "arena-hero-agent"
version = "0.1.0"
description = "Arena Hero Python-first agent (Spec v4)"
requires-python = ">=3.11"
dependencies = [
    "arena-hero-sdk-py>=0.2.9",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "ty>=0.0.1",
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "hypothesis>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arena_hero_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
